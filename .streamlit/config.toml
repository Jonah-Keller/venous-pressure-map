# Look and behaviour of the app. Colours match the hero banner in app.py.
[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#e9eef5"
textColor = "#1b2533"
font = "sans serif"
baseRadius = "medium"

[server]
maxUploadSize = 25        # MB

[browser]
gatherUsageStats = false
